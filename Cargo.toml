[package]
name = "gurk"
description = "Signal messenger client for terminal"
version = "0.10.2"
authors = ["boxdot <d@zerovolt.org>"]
edition = "2024"
keywords = ["signal", "tui"]
repository = "https://github.com/boxdot/gurk-rs"
license = "AGPL-3.0-only"
categories = ["command-line-utilities"]
resolver = "2"
rust-version = "1.94.0"

[workspace]
members = ["xtask"]

[profile.dev.package.miniz_oxide]
# This speeds up `cargo xtask dist`.
opt-level = 3

[profile.dev.package.sqlcipher-crypto-provider]
# This speeds up database decryption on debug builds
opt-level = 3

[profile.dev.package.sha2]
# This speeds up database decryption on debug builds
opt-level = 3

[profile.release]
debug = 0
lto = "thin"

[profile.bench]
debug = true

[features]
dev = ["prost"]

[dependencies]
shell-words = "1.1"
crc32fast = "1.4"
spellbook = "=0.4.2"
encoding_rs = "0.8"
presage = { git = "https://github.com/whisperfish/presage", rev = "94b3978f5456469cfd4d9f72351a5eff93715f81", default-features = false }
presage-store-sqlite = { git = "https://github.com/whisperfish/presage", rev = "94b3978f5456469cfd4d9f72351a5eff93715f81", default-features = false }

# dev feature dependenciestoml
prost = { version = "0.14.4", optional = true }
base64 = "0.22.1"

aho-corasick = "1.1.3"
anyhow = "1.0.94"
arboard = { version = "3.4.1", features = ["wayland-data-control"] }
async-trait = "0.1.83"
chrono = { version = "0.4.39", default-features = false, features = ["serde"] }
clap = { version = "4.5.23", features = ["derive", "env"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
dirs = "6.0.0"
emojis = "0.9.0"
futures-channel = "0.3.31"
hex = "0.4.3"
hostname = "0.4.0"
image = { version = "0.25.5", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
itertools = "0.15.0"
libsqlite3-sys = { version = "0.36.0", features = [
    "bundled-sqlcipher-custom-crypto",
] }
log-panics = "2.1.0"
mime_guess = "2.0.5"
notify-rust = "4.11.3"
opener = "0.8.2"
phonenumber = "0.3.6"
postcard = { version = "1.1.1", features = ["alloc"] }
ratatui = "0.30.0"
ratatui-image = { version = "=11.1.0", default-features = false, features = ["crossterm"] }
regex = "1.11.1"
scopeguard = "1.2.0"
serde = { version = "1.0.216", features = ["derive"] }
serde_json = "1.0.134"
sqlx = { version = "0.9.0", features = [
    "sqlite",
    "runtime-tokio",
    "uuid",
    "chrono",
] }
textwrap = "0.16.1"
thiserror = "2.0.9"
tokio = { version = "1.42.0", default-features = false, features = [
    "rt-multi-thread",
    "macros",
    "net",
    "time",
    "fs",
    "io-util",
    "sync",
] }
tokio-stream = "0.1.17"
toml = "1.1.3"
tracing = "0.1.41"
tracing-appender = "0.2.3"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
unicode-width = "0.2.0"
unicode-segmentation = "=1.13.3"
uuid = { version = "1.11", features = ["v4"] }
url = "2.5.4"
tempfile = "3.14.0"
crokey = "1.1.0"
strum_macros = "0.28.0"
strum = { version = "0.28.0", features = ["derive"] }
qrcode = { version = "0.14.1", default-features = false, features = ["image"] }
sha2 = "0.11.0"
strip-ansi-escapes = "0.2.1"
dialoguer = "0.12.0"
zeroize = { version = "1.8.1", features = ["derive", "serde"] }
edit = "0.1.5"

# Signal Secure Backup reader, credentials and forward-secrecy recovery.
libsignal-message-backup = { git = "https://github.com/signalapp/libsignal", tag = "v0.106.1", features = ["test-util", "json"] }
libsignal-account-keys = { git = "https://github.com/signalapp/libsignal", tag = "v0.106.1" }
libsignal-core = { git = "https://github.com/signalapp/libsignal", tag = "v0.106.1" }
libsignal-net = { git = "https://github.com/signalapp/libsignal", tag = "v0.106.1" }
libsignal-net-infra = { git = "https://github.com/signalapp/libsignal", tag = "v0.106.1" }
zkgroup = { git = "https://github.com/signalapp/libsignal", tag = "v0.106.1" }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream"] }
futures = "0.3"
protobuf = "=3.7.2"
http = "1"
libc = "0.2"
libsignal-svrb = { git = "https://github.com/signalapp/libsignal", tag = "v0.106.1" }
rand = "0.9"
aes = "0.9"
cbc = "0.2"
hmac = "0.13"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.2.0"

[package.metadata.cargo-machete]
# not used directly; brings sqlcipher capabilities to sqlite
ignored = ["libsqlite3-sys"]

[dev-dependencies]
criterion = { version = "0.8.1", features = ["async_tokio", "html_reports"] }
hex-literal = "1.0.0"
quickcheck = "1.0.3"
quickcheck_macros = "1.0.0"

[[bench]]
name = "app"
harness = false
required-features = ["dev"]

# [patch."https://github.com/whisperfish/presage.git"]
# presage = { path = "../presage/presage" }
# presage-store-sqlite = { path = "../presage/presage-store-sqlite" }
#
# [patch."https://github.com/whisperfish/libsignal-service-rs"]
# libsignal-service = { path = "../libsignal-service-rs" }

[patch.crates-io]
# - Custom crypto provider
# - Disable atexit cleanup in sqlcipher, which unsafe when other threads may
#   still be closing database connections.
libsqlite3-sys = { version = "0.36.0", git = "https://github.com/boxdot/rusqlite", rev = 'a2f393913d9994645c94810498bef07b2183b3dc' }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "=0.13.13", default-features = false, features = ["tokio", "screenshot"] }

# Signal requires the encrypted upload length when requesting attachment forms.
# Upstream fix: whisperfish/libsignal-service-rs#501; pin for reproducible builds.
[patch."https://github.com/whisperfish/libsignal-service-rs"]
libsignal-service = { path = "vendor/libsignal-service" }

[patch."https://github.com/whisperfish/presage"]
presage = { path = "vendor/presage" }
